name: Docker Build and Publish

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - '*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE_NAME: ${{ vars.DOCKER_IMAGE || 'niicloudoperation/notebook' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Docker to use /mnt
        run: |
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          sudo tee /etc/docker/daemon.json <<EOF
          {
            "data-root": "/mnt/docker"
          }
          EOF
          sudo systemctl start docker
          docker info | grep "Docker Root Dir"
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan pushed image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          format: json
          output: trivy-results-notebook.json
          exit-code: '0'
          list-all-pkgs: 'true'

      - name: Convert Trivy report to SARIF
        env:
          TRIVY_SCANNERS: ''
        run: |
          trivy convert \
            --format sarif \
            --output trivy-results-notebook.sarif \
            trivy-results-notebook.json

      - name: Render vulnerability summary
        env:
          IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/ci/render-trivy-report.py \
            --input trivy-results-notebook.json \
            --output trivy-report-notebook.md \
            --image "$IMAGE" \
            --commit "$COMMIT" \
            --run-url "$RUN_URL"
          tee -a "$GITHUB_STEP_SUMMARY" < trivy-report-notebook.md

      - name: Upload vulnerability reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-scan-notebook
          path: |
            trivy-results-notebook.json
            trivy-results-notebook.sarif
            trivy-report-notebook.md
          retention-days: 14

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-results-notebook.sarif
          category: trivy-notebook
