name: E2E Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  notebook-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ui-tests/e2e-notebook/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          set -euxo pipefail
          pip install --upgrade pip
          pip install -r ui-tests/e2e-notebook/requirements.txt

      - name: Install Playwright browsers
        run: |
          set -euxo pipefail
          python -m playwright install --with-deps

      - name: Build Docker image
        run: |
          set -euxo pipefail
          docker build -t niicloudoperation/notebook:test .

      - name: Scan E2E image with Trivy
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: niicloudoperation/notebook:test
          scanners: vuln
          vuln-type: os,library
          format: json
          output: trivy-results-notebook.json
          exit-code: '0'
          list-all-pkgs: 'true'

      - name: Convert Trivy report to SARIF
        if: github.event_name == 'pull_request'
        env:
          TRIVY_SCANNERS: ''
        run: |
          trivy convert \
            --format sarif \
            --output trivy-results-notebook.sarif \
            trivy-results-notebook.json

      - name: Render vulnerability summary
        if: github.event_name == 'pull_request'
        env:
          IMAGE: niicloudoperation/notebook:test
          COMMIT: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/ci/render-trivy-report.py \
            --input trivy-results-notebook.json \
            --output trivy-report-notebook.md \
            --image "$IMAGE" \
            --commit "$COMMIT" \
            --run-url "$RUN_URL"
          tee -a "$GITHUB_STEP_SUMMARY" < trivy-report-notebook.md

      - name: Upload vulnerability reports
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-scan-notebook
          path: |
            trivy-results-notebook.json
            trivy-results-notebook.sarif
            trivy-report-notebook.md
          retention-days: 14

      # Fork pull requests receive a read-only token, so their reports remain
      # available in the workflow summary and artifact instead of Code Scanning.
      - name: Upload SARIF to GitHub Code Scanning
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-results-notebook.sarif
          category: trivy-notebook

      - name: Prepare test workspace
        run: |
          set -euxo pipefail
          mkdir -p ui-tests/e2e-notebook/artifacts/jupyter-work
          cp -r test-work/* ui-tests/e2e-notebook/artifacts/jupyter-work/
          chmod -R a+w ui-tests/e2e-notebook/artifacts/jupyter-work

      - name: Start Docker container
        run: |
          set -euxo pipefail
          docker run -d --name jupyter_e2e_container -p 8888:8888 \
            -v $(pwd)/ui-tests/e2e-notebook/artifacts/jupyter-work:/home/jovyan/work \
            niicloudoperation/notebook:test start-notebook.sh \
            --ServerApp.token='test-token' --ServerApp.allow_origin='*' --ServerApp.root_dir='/home/jovyan/work'
          sleep 20
          # Health check
          curl --retry 10 --retry-delay 3 --retry-connrefused --fail http://localhost:8888/tree?token=test-token || {
            docker logs jupyter_e2e_container
            exit 1
          }

      - name: Run notebook E2E tests
        env:
          E2E_TRANSITION_TIMEOUT: '30000'
          NOTEBOOK7_URL: 'http://localhost:8888/tree'
          JUPYTER_TOKEN: 'test-token'
          JUPYTER_WORK_DIR: ${{ github.workspace }}/ui-tests/e2e-notebook/artifacts/jupyter-work
        run: |
          set -euxo pipefail
          python ui-tests/e2e-notebook/run_notebooks.py --skip-failed-test

      - name: Gather Docker logs
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p ui-tests/e2e-notebook/artifacts
          docker logs jupyter_e2e_container > ui-tests/e2e-notebook/artifacts/jupyter.log 2>&1 || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            ui-tests/e2e-notebook/artifacts

      - name: Shutdown container
        if: always()
        run: |
          set -euxo pipefail
          docker stop jupyter_e2e_container || true
          docker rm jupyter_e2e_container || true
